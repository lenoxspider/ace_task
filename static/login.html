<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="compact">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unlock · Ace775 Command Center</title>
  <meta name="description" content="Secure master-password lock screen for the Ace775 automation control center.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="login">

  <div class="login-wrap">
    <div class="login">
      <div class="login__brand">
        <div class="login__mark" id="login-mark"></div>
        <div>
          <h1>Ace775 Command Center</h1>
          <p>Enter the master password to unlock automation controls</p>
        </div>
      </div>

      <form class="login__card" id="login-form">
        <div class="field">
          <label for="dash-password">Master password</label>
          <div style="position:relative">
            <input id="dash-password" type="password" placeholder="••••••••" required autofocus autocomplete="current-password" style="padding-right:44px">
            <button type="button" id="btn-eye" class="iconbtn" aria-label="Toggle password visibility"
              style="position:absolute;right:5px;top:50%;transform:translateY(-50%)"></button>
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--block" id="btn-unlock" style="height:40px">
          <span data-i="lock"></span> <span id="btn-unlock-label">Unlock console</span>
        </button>

        <div class="banner" id="login-banner"></div>
      </form>

      <p class="login__foot">Session-token authentication · dashboard locked after inactivity</p>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="js/icons.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages/login.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll("[data-i]").forEach(function (el) { el.innerHTML = Ace.icon(el.dataset.i, 16); });
    });
  </script>
</body>
</html>
