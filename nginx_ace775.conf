# ==============================================================================
# Ace775 Command Center - Production Nginx Reverse Proxy Configuration (#15)
# Supports SSE Streaming, WebSockets, and Let's Encrypt SSL
# ==============================================================================

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Redirect all HTTP traffic to HTTPS (uncomment after running Certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSockets & Connection Keep-Alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client IP & Host Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL for SSE Live Console Streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

